name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Use local properties to use mock
      run: echo "fluxzen.dir=mock-ui-design" > local.properties

    - name: Create settings for mock
      run: |
        mkdir -p mock-ui-design/ui-design
        mv mock-ui-design/src mock-ui-design/ui-design/
        mv mock-ui-design/build.gradle.kts mock-ui-design/ui-design/
        cat << 'INNER_EOF' > mock-ui-design/settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
            plugins {
                id("com.android.library") version "9.2.1"
                id("org.jetbrains.kotlin.android") version "2.3.21"
                id("org.jetbrains.kotlin.plugin.compose") version "2.3.21"
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "FluxZenShared"
        include(":ui-design")
        include(":firebase-auth")
        INNER_EOF
        mkdir -p mock-ui-design/firebase-auth
        cat << 'INNER_EOF' > mock-ui-design/firebase-auth/build.gradle.kts
        plugins {
            id("com.android.library")
        }
        android {
            namespace = "com.fluxzen.firebase_auth"
            compileSdk = 36
            defaultConfig { minSdk = 31 }
        }
        INNER_EOF
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      env:
        GPR_USER: ${{ github.actor }}
        GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
