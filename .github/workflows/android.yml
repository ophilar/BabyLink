name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GPR_USER: ${{ github.actor }}
      GPR_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug -Pgpr.user="${{ github.actor }}" -Pgpr.token="${{ secrets.PACKAGES_TOKEN }}"
      env:
        GITHUB_ACTIONS: "true"
