[versions]
# Build Tools & Plugins
androidGradlePlugin = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.6"
googleServices = "4.4.4"
hilt = "2.59.2"

# AndroidX Core & Lifecycle
androidxActivity = "1.13.0"
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxWork = "2.10.0"
androidxNavigation = "2.8.5"
androidxNavigation3 = "1.1.1"
material = "1.14.0"
playServicesNearby = "19.3.0"

# UI & Compose
androidxComposeBom = "2026.05.00"

# Dependency Injection
hiltExt = "1.2.0"

# Networking & WebRTC
webrtc = "144.7559.05"
gson = "2.14.0"

# AI & MediaPipe
mediapipe = "0.10.35"
litert = "2.0.2"

# Firebase
firebaseBom = "33.7.0"

# Security & FluxZen
fluxzenShared = "1.0.2"

# Testing
junitJupiter = "6.0.3"
mockito = "5.23.0"
mockitoKotlin = "6.3.0"
turbine = "1.2.0"
androidxTestExt = "1.3.0"
espresso = "3.7.0"
kotlinxCoroutines = "1.10.1"

[libraries]
# --- Project Context ---
ui-design = { group = "com.fluxzen", name = "ui-design", version.ref = "fluxzenShared" }
firebase-auth = { group = "com.fluxzen", name = "firebase-auth", version.ref = "fluxzenShared" }

# --- AndroidX Core ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "androidxNavigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "androidxNavigation3" }

# --- Compose UI ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-material3-windowsize = { group = "androidx.compose.material3", name = "material3-window-size-class" }

# --- Dependency Injection ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltExt" }

# --- AI & Streaming ---
mediapipe-tasks-audio = { group = "com.google.mediapipe", name = "tasks-audio", version.ref = "mediapipe" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
webrtc-android = { group = "io.github.webrtc-sdk", name = "android", version.ref = "webrtc" }
gson = { group = "com.google.code.gson", name = "gson", version = "2.14.0" }

# --- Firebase ---
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }

# --- Google & External ---
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
play-services-nearby = { group = "com.google.android.gms", name = "play-services-nearby", version.ref = "playServicesNearby" }

# --- Testing ---
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
android-desugar-jdk = { group = "com.android.tools", name = "desugar_jdk_libs", version = "2.1.4" }

[bundles]
compose = [
    "androidx-ui",
    "androidx-ui-graphics",
    "androidx-ui-tooling-preview",
    "androidx-material3",
    "androidx-material-icons-extended",
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-activity-compose",
    "androidx-navigation-compose",
    "androidx-material3-windowsize"
]
hilt = [
    "hilt-android",
    "hilt-navigation-compose"
]
firebase = [
    "firebase-analytics",
    "firebase-crashlytics"
]
navigation3 = [
    "androidx-navigation3-runtime",
    "androidx-navigation3-ui"
]
test-unit = [
    "junit-jupiter-api",
    "mockito-core",
    "mockito-kotlin",
    "turbine",
    "kotlinx-coroutines-test"
]
test-android = [
    "androidx-test-ext-junit",
    "androidx-espresso-core",
    "androidx-ui-test-junit4"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.7" }
